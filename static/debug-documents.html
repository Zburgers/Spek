<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Management Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .button { padding: 10px 15px; margin: 5px; border: none; background: #007bff; color: white; cursor: pointer; }
        .button:hover { background: #0056b3; }
        .error { color: red; }
        .success { color: green; }
        .debug { color: #666; font-family: monospace; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Document Management Debug Test</h1>
    
    <div class="debug-section">
        <h3>Test Document API Endpoints</h3>
        <button class="button" onclick="testListDocuments()">Test List Documents</button>
        <button class="button" onclick="testUploadDocument()">Test Upload Document</button>
        <button class="button" onclick="testDocumentManager()">Test Document Manager</button>
        <div id="test-results"></div>
    </div>

    <div class="debug-section">
        <h3>Upload Test</h3>
        <input type="file" id="test-file" accept=".txt,.pdf,.doc,.docx">
        <select id="scope-select">
            <option value="app_wide">App-wide</option>
            <option value="chat_specific">Chat-specific</option>
        </select>
        <button class="button" onclick="uploadTestFile()">Upload File</button>
        <div id="upload-results"></div>
    </div>

    <script>
        // Mock minimal spekApp for testing
        if (!window.spekApp) {
            window.spekApp = {
                apiClient: {
                    baseURL: '/api/v1',
                    async request(endpoint, options = {}) {
                        const url = `${this.baseURL}${endpoint}`;
                        const headers = { 'Content-Type': 'application/json', ...options.headers };
                        
                        const token = localStorage.getItem('access_token');
                        if (token) {
                            headers['Authorization'] = `Bearer ${token}`;
                        }

                        const config = { ...options, headers };
                        const response = await fetch(url, config);
                        
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({ detail: `HTTP error! status: ${response.status}` }));
                            throw new Error(errorData.detail);
                        }
                        
                        return response.json();
                    },
                    async getDocuments() {
                        const response = await this.request('/documents', { method: 'GET' });
                        const documents = Array.isArray(response) ? response : (response.data || []);
                        return {
                            data: documents.map(doc => ({
                                uuid: doc.uuid || doc.id,
                                id: doc.uuid || doc.id,
                                filename: doc.filename || doc.file_name || doc.title,
                                file_name: doc.file_name || doc.filename || doc.title,
                                file_type: doc.file_type,
                                file_size: doc.file_size,
                                processing_status: doc.processing_status || doc.status,
                                status: doc.status || doc.processing_status,
                                scope: doc.scope || 'app_wide',
                                created_at: doc.created_at
                            }))
                        };
                    },
                    async uploadDocument(file, scope = 'app_wide') {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('scope', scope);

                        const response = await fetch(`${this.baseURL}/documents/upload`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                            },
                            body: formData,
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({ detail: `HTTP error! status: ${response.status}` }));
                            throw new Error(errorData.detail);
                        }

                        return response.json();
                    }
                }
            };
        }

        function log(message, type = 'debug') {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            results.appendChild(div);
            console.log(message);
        }

        async function testListDocuments() {
            log('Testing document list API...');
            try {
                const response = await window.spekApp.apiClient.getDocuments();
                log(`✅ Successfully fetched documents: ${JSON.stringify(response, null, 2)}`, 'success');
                log(`📊 Document count: ${response.data.length}`);
                if (response.data.length > 0) {
                    log(`📋 Document scopes: ${response.data.map(d => d.scope).join(', ')}`);
                }
            } catch (error) {
                log(`❌ Error fetching documents: ${error.message}`, 'error');
            }
        }

        async function uploadTestFile() {
            const fileInput = document.getElementById('test-file');
            const scopeSelect = document.getElementById('scope-select');
            const results = document.getElementById('upload-results');
            
            if (!fileInput.files[0]) {
                results.innerHTML = '<div class="error">Please select a file first</div>';
                return;
            }

            const file = fileInput.files[0];
            const scope = scopeSelect.value;
            
            try {
                results.innerHTML = '<div class="debug">Uploading...</div>';
                const response = await window.spekApp.apiClient.uploadDocument(file, scope);
                results.innerHTML = `<div class="success">✅ Upload successful!</div><pre>${JSON.stringify(response, null, 2)}</pre>`;
                
                // Test list after upload
                setTimeout(async () => {
                    await testListDocuments();
                }, 1000);
                
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Upload failed: ${error.message}</div>`;
            }
        }

        async function testDocumentManager() {
            log('Testing DocumentManager integration...');
            if (window.documentManager) {
                try {
                    await window.documentManager.refreshDocuments();
                    log('✅ DocumentManager refresh completed', 'success');
                } catch (error) {
                    log(`❌ DocumentManager error: ${error.message}`, 'error');
                }
            } else {
                log('⚠️ DocumentManager not found - this is normal if not on chat page', 'debug');
            }
        }

        // Auto-test on page load if authenticated
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (token) {
                log('🔑 Found auth token, running initial test...');
                testListDocuments();
            } else {
                log('❌ No auth token found. Please login first.', 'error');
            }
        };
    </script>
</body>
</html>
